global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Marquez removed — it doesn't expose Prometheus metrics
  # Marquez data comes via Grafana → Postgres datasource directly 